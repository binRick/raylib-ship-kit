# Generated into ios/Game.xcodeproj by xcodegen (the scripts in scripts/ios-*.sh run it for you).
# ${...} values come from kit.env and VERSION via the environment; paths are relative to ios/.
name: Game
options:
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release
  createIntermediateGroups: true

settings:
  base:
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: YES
    OTHER_CFLAGS: >-
      -DPLATFORM_IOS
      -DGRAPHICS_API_OPENGL_ES3
      -DGL_SILENCE_DEPRECATION
      -Wno-deprecated-declarations
      -include $(SRCROOT)/raylib_ios_glcompat.h
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../vendor-ios/include
      - $(SRCROOT)/../src
      - $(SRCROOT)
    GCC_OPTIMIZATION_LEVEL: "s"

targets:
  Game:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_NAME: ${APP_SLUG}
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        APP_DISPLAY_NAME: ${APP_NAME}
        APP_CATEGORY: ${APP_CATEGORY}
        MARKETING_VERSION: ${APP_VERSION}
        CURRENT_PROJECT_VERSION: ${APP_VERSION}
        INFOPLIST_FILE: $(SRCROOT)/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CLANG_ENABLE_OBJC_ARC: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # lib-iphoneos or lib-iphonesimulator, whichever SDK this build is for
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../vendor-ios/lib$(EFFECTIVE_PLATFORM_NAME)
        OTHER_LDFLAGS:
          - -lraylib
    sources:
      - path: KitBridge.h
      - path: KitBridge.m
      - path: raylib_ios_glcompat.h
      - path: ../src
        includes: ["*.c", "*.h"]
      # actool cuts every icon size from the one 1024px image; keep this a group, not a folder reference
      - path: Assets.xcassets
    # assets/ is copied by script, so new files ship without touching the Xcode project.
    postBuildScripts:
      - name: Copy assets into the bundle
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          rsync -a --delete --exclude '.DS_Store' "$SRCROOT/../assets/" "$TARGET_BUILD_DIR/$WRAPPER_NAME/assets/"
