# Builds Linux, Windows and browser versions on every push, and publishes the browser
# build to GitLab Pages from the default branch. macOS and iOS need a Mac: run those
# scripts locally (or on a macOS runner).
stages: [build, deploy]

linux:
  stage: build
  image: debian:bookworm
  script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential cmake git libasound2-dev libx11-dev libxrandr-dev libxi-dev
      libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev
    - scripts/build-linux.sh
  artifacts:
    paths: [dist/]

windows:
  stage: build
  image: debian:bookworm
  script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential cmake git zip mingw-w64
    - scripts/build-windows.sh
  artifacts:
    paths: [dist/]

web:
  stage: build
  image: emscripten/emsdk:latest
  script:
    - scripts/build-web.sh
  artifacts:
    paths: [dist/web/]

pages:
  stage: deploy
  needs: [web]
  script:
    - mv dist/web public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
